<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 232" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="232" fill="#ffffff"/><defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#444"/>
    </marker>
  </defs>
  <!-- Repository -->
  <rect x="20" y="56" width="150" height="130" rx="3" fill="none" stroke="#444" stroke-width="1"/>
  <text x="95" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="#111">Repository</text>
  <text x="95" y="86" text-anchor="middle" font-size="10.5" fill="#444" font-family="monospace">src/</text>
  <text x="95" y="110" text-anchor="middle" font-size="10.5" fill="#444" font-family="monospace">docs/  ADR/</text>
  <!-- context.md inside the repo, emphasized -->
  <rect x="38" y="128" width="114" height="40" rx="3" fill="#f2f2f2" stroke="#111" stroke-width="1.6"/>
  <text x="95" y="145" text-anchor="middle" font-size="10.5" font-weight="700" font-family="monospace" fill="#111">context.md</text>
  <text x="95" y="160" text-anchor="middle" font-size="8.5" fill="#555">intent &#183; constraints &#183; ledger</text>

  <!-- consult arrow (layer -> agent) -->
  <line x1="176" y1="92" x2="292" y2="92" stroke="#444" stroke-width="1.1" marker-end="url(#ah)"/>
  <text x="234" y="82" text-anchor="middle" font-size="9.5" fill="#333" font-style="italic">consult</text>

  <!-- Agent -->
  <rect x="296" y="56" width="150" height="130" rx="3" fill="none" stroke="#444" stroke-width="1"/>
  <text x="371" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="#111">Agent session</text>
  <text x="371" y="94" text-anchor="middle" font-size="10.5" fill="#444">plan</text>
  <text x="371" y="118" text-anchor="middle" font-size="10.5" fill="#444">execute</text>
  <text x="371" y="142" text-anchor="middle" font-size="10.5" fill="#444">observe</text>
  <text x="371" y="166" text-anchor="middle" font-size="10.5" fill="#444">propose lessons</text>

  <!-- propose arrow (agent -> review) -->
  <line x1="452" y1="121" x2="536" y2="121" stroke="#444" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <text x="494" y="111" text-anchor="middle" font-size="9.5" fill="#333" font-style="italic">propose</text>

  <!-- Review gate -->
  <rect x="540" y="91" width="140" height="60" rx="3" fill="none" stroke="#111" stroke-width="1.6"/>
  <text x="610" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#111">Human review</text>
  <text x="610" y="132" text-anchor="middle" font-size="9" fill="#555">same gate as code (P5)</text>

  <!-- commit arrow (review -> repo), routed underneath -->
  <path d="M 610 155 L 610 208 L 95 208 L 95 192" fill="none" stroke="#444" stroke-width="1.1" marker-end="url(#ah)"/>
  <text x="352" y="200" text-anchor="middle" font-size="9.5" fill="#333" font-style="italic">context diff commits with the code change</text>
</svg>